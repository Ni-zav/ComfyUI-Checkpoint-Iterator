name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q checkpoint_eval.py iterator_node.py tests
      - name: Offline tests
        run: python -m unittest discover -s tests -v
